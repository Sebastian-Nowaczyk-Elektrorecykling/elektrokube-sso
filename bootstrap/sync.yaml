apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elektrokube-sso
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/elektrokube
  sourceRef:
    kind: GitRepository
    name: elektrokube-sso
  prune: false
  deletionPolicy: Orphan
