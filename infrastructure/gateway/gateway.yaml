apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lan-gateway
  namespace: sso
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  # HTTPRoutes select hostnames; the shared listener imposes no DNS-depth limit.
  # Every registered hostname still needs a SAN in the referenced certificate.
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: sso-gateway-tls
    allowedRoutes:
      namespaces:
        from: Same
