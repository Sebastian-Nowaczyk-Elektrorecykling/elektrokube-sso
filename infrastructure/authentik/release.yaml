apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: sso
spec:
  interval: 10m
  timeout: 15m
  releaseName: authentik
  chart:
    spec:
      chart: authentik
      version: 2026.8.3
      sourceRef:
        kind: HelmRepository
        name: sso-authentik
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  driftDetection:
    mode: enabled
  values:
    authentik:
      secret_key: ''
      postgresql:
        host: authentik-db-rw.sso.svc.cluster.local
        name: authentik
        user: authentik
      error_reporting:
        enabled: false
    postgresql:
      enabled: false
    global:
      env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: sso-credentials
            key: authentik-secret-key
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-db-app
            key: password
      - name: SSO_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: sso-credentials
            key: oidc-client-secret
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    server:
      replicas: 1
      ingress:
        enabled: false
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      serviceAccountName: default
      automountServiceAccountToken: false
    worker:
      replicas: 1
      env:
      - name: AUTHENTIK_BOOTSTRAP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: sso-credentials
            key: bootstrap-password
      - name: AUTHENTIK_BOOTSTRAP_EMAIL
        value: akadmin@internal
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      serviceAccountName: default
      automountServiceAccountToken: false
    blueprints:
      configMaps:
      - sso-authentik-blueprints
    serviceAccount:
      create: false
