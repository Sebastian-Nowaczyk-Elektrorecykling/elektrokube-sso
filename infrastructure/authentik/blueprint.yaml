# Authentik's native blueprint format. No custom policies or property mappings.
version: 1
metadata:
  name: Elektrokube SSO
entries:
  - model: authentik_core.group
    identifiers:
      name: sso-users
    attrs:
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: cluster-admins
    attrs:
      is_superuser: true
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: elektrokube
    attrs:
      client_id: elektrokube
      client_secret: !Env SSO_OIDC_CLIENT_SECRET
      client_type: confidential
      grant_types: [authorization_code, client_credentials]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://auth.internal/oauth2/callback
        - matching_mode: strict
          url: https://authentik.admin.internal/oauth2/callback
        - matching_mode: strict
          url: https://openfga.admin.internal/oauth2/callback
      sub_mode: user_uuid
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
  - model: authentik_core.application
    identifiers:
      slug: elektrokube
    attrs:
      name: Elektrokube SSO
      provider: !KeyOf provider
      meta_launch_url: https://auth.internal/if/user/
      meta_description: Internal services protected by Cilium, Heimdall and OpenFGA
