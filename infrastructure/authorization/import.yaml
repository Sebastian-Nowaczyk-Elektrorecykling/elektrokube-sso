apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-policy-v1
  namespace: sso
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: openfga-policy
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: import
        image: openfga/cli:v0.8.1
        args:
        - store
        - import
        - --file=/policy/store.fga.yaml
        env:
        - name: FGA_API_URL
          value: http://openfga.sso.svc.cluster.local:8080
        - name: FGA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: sso-credentials
              key: openfga-token
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        volumeMounts:
        - name: policy
          mountPath: /policy
          readOnly: true
      volumes:
      - name: policy
        configMap:
          name: openfga-policy-v1
