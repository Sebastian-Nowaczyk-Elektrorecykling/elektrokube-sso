# Immutable policy release. Bump the store and Job version together when changing it.
name: elektrokube-sso-v1
model: |
  model
    schema 1.1
  type user
  type group
    relations
      define member: [user]
  type service
    relations
      define viewer: [group#member]
      define admin: [group#member]
      define can_access: viewer or admin
tuples:
  - user: group:sso-users#member
    relation: viewer
    object: service:auth.internal
  - user: group:cluster-admins#member
    relation: admin
    object: service:auth.internal
  - user: group:cluster-admins#member
    relation: admin
    object: service:authentik.admin.internal
  - user: group:cluster-admins#member
    relation: admin
    object: service:openfga.admin.internal
tests:
  - name: Ordinary users can use their portal, but cannot administer services
    tuples:
      - user: user:alice
        relation: member
        object: group:sso-users
    check:
      - user: user:alice
        object: service:auth.internal
        assertions: {can_access: true}
      - user: user:alice
        object: service:authentik.admin.internal
        assertions: {can_access: false}
      - user: user:alice
        object: service:openfga.admin.internal
        assertions: {can_access: false}
  - name: Administrators can access all three services
    tuples:
      - user: user:admin
        relation: member
        object: group:cluster-admins
    check:
      - user: user:admin
        object: service:auth.internal
        assertions: {can_access: true}
      - user: user:admin
        object: service:authentik.admin.internal
        assertions: {can_access: true}
      - user: user:admin
        object: service:openfga.admin.internal
        assertions: {can_access: true}
  - name: Unknown identities and unregistered services are denied
    check:
      - user: user:unknown
        object: service:auth.internal
        assertions: {can_access: false}
      - user: user:unknown
        object: service:openfga.admin.internal
        assertions: {can_access: false}
      - user: user:unknown
        object: service:anything.admin.internal
        assertions: {can_access: false}
