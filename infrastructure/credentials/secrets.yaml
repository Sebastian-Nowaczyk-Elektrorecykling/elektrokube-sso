apiVersion: v1
kind: Secret
metadata:
  name: sso-credentials
  namespace: sso
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: authentik-secret-key,oidc-client-secret,bootstrap-password
    secret-generator.v1.mittwald.de/length: '64'
    secret-generator.v1.mittwald.de/encoding: hex
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-cookie
  namespace: sso
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: cookie-secret
    secret-generator.v1.mittwald.de/length: 32B
    # oauth2-proxy decodes URL-safe Base64 into a 32-byte AES key.
    secret-generator.v1.mittwald.de/encoding: base64url
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
