serve:
  host: 0.0.0.0
  port: 4456
management:
  host: 0.0.0.0
  port: 4457
log:
  level: info
  format: text
metrics:
  enabled: false
tracing:
  enabled: false
mechanisms:
  authenticators:
    - id: deny
      type: unauthorized
    - id: session
      type: generic
      config:
        identity_info_endpoint:
          url: http://oauth2-proxy.sso.svc.cluster.local:4180/oauth2/userinfo
          method: GET
        authentication_data_source:
          - header: Authorization
            scheme: Bearer
          - cookie: __Host-elektrokube_sso
        forward_headers: [Authorization]
        forward_cookies: [__Host-elektrokube_sso]
        subject:
          id: user
        cache_ttl: 0s
  authorizers:
    - id: service-group
      type: cel
      config:
        # Empty means administrator-only. Each ordinary service names its group.
        values:
          group: ""
        # Only the authenticated oauth2-proxy response supplies group membership.
        expressions:
          - expression: >-
              Subject.ID != "" &&
              has(Subject.Attributes.groups) &&
              type(Subject.Attributes.groups) == list &&
              Subject.Attributes.groups.exists(g,
                g == "cluster-admins" || g == "authentik Admins" ||
                (Values.group != "" && g == Values.group))
            message: Account is not in an allowed service group
  finalizers:
    - id: noop
      type: noop
  error_handlers:
    - id: login
      type: redirect
      config:
        to: https://{{ .Request.URL.Host }}/oauth2/start?rd={{ .Request.URL | urlenc }}
        code: 302
    - id: access-denied
      type: redirect
      config:
        # A public static page must not require the permission being denied.
        to: https://auth.internal/sso/access-denied
        code: 302
default_rule:
  execute:
    - authenticator: deny
    - finalizer: noop
providers:
  file_system:
    # Load only the rule file, not Kubernetes' projected-volume symlinks.
    src: /etc/heimdall-rules/rules.yaml
    # Kustomize hashes ConfigMap names; Flux rolls the Deployment after changes.
    watch: false
