apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      automountServiceAccountToken: false
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
        args:
        - --provider=oidc
        - --oidc-issuer-url=https://auth.internal/application/o/elektrokube/
        - --client-id=elektrokube
        - --http-address=0.0.0.0:4180
        - --reverse-proxy=true
        - --redirect-url=/oauth2/callback
        - --code-challenge-method=S256
        - --scope=openid profile
        - --email-domain=*
        - --oidc-email-claim=sub
        - --oidc-groups-claim=groups
        # Verify issuer, audience, expiry and signature before exposing JWT claims.
        - --skip-jwt-bearer-tokens=true
        - --bearer-token-login-fallback=false
        - --cookie-name=__Host-elektrokube_sso
        - --cookie-path=/
        - --cookie-secure=true
        - --cookie-httponly=true
        - --cookie-samesite=lax
        - --cookie-expire=5m
        - --session-cookie-minimal=true
        - --upstream=static://202
        - --skip-provider-button=true
        - --skip-auth-strip-headers=false
        - --pass-access-token=false
        - --pass-authorization-header=false
        - --pass-user-headers=false
        - --provider-ca-file=/etc/sso-ca/ca.crt
        - --whitelist-domain=auth.internal
        - --whitelist-domain=authentik.admin.internal
        - --whitelist-domain=openfga.admin.internal
        ports:
        - name: http
          containerPort: 4180
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        env:
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: sso-credentials
              key: oidc-client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-cookie
              key: cookie-secret
        volumeMounts:
        - name: ca
          mountPath: /etc/sso-ca
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ready
            port: http
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
      volumes:
      - name: ca
        secret:
          secretName: sso-gateway-tls
          items:
          - key: ca.crt
            path: ca.crt
      hostAliases:
      - ip: ${API_IP}
        hostnames:
        - auth.internal
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  type: ClusterIP
  selector:
    app: oauth2-proxy
  ports:
  - name: http
    port: 4180
    targetPort: http
